name: Publish PopovWeb to GitHub Pages

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: php -l server/contact.php && php qa/contact-php.test.php
      - run: npm run build
        env:
          SITE_BASE_PATH: /popovweb/
          SITE_URL: https://fedroid74.github.io/popovweb/
          SITE_INDEXABLE: 'false'
          CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
          CONTACT_DISABLED: ${{ vars.CONTACT_ENDPOINT == '' && 'true' || 'false' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
